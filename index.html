<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dayne Bonuses</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="top-bar">
      <div class="tabs">
        <button class="tab active" data-sheet="all">All</button>
        <button class="tab" data-sheet="raw">Raw</button>
        <button class="tab" data-sheet="cleaned">Clean</button>
        <button class="tab" data-sheet="fresh">Fresh</button>
        <button class="tab" data-sheet="upload">Upload</button>
        <button class="tab reset-tab" data-sheet="reset">Reset</button>
      </div>
      <div class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" accept=".csv" hidden />
          <button class="upload-btn" id="uploadBtn">+ Upload CSV</button>
          <span class="file-name" id="fileName"></span>
        </div>
      </div>
      <div class="sheet-info" id="sheetInfo"></div>
      <div class="sites-toolbar" id="sitesToolbar" hidden>
        <input type="search" id="sitesSearch" placeholder="Search sites, merchants, status…" autocomplete="off" />
        <div class="cols-wrap">
          <button class="cols-btn" id="colsBtn" type="button">Columns ▾</button>
          <div class="cols-dropdown" id="colsDropdown" hidden></div>
        </div>
      </div>
      <div class="legend" id="legend" hidden></div>
      <div class="table-wrapper">
        <table id="dataTable">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
      <div class="detail-overlay" id="detailOverlay" hidden>
        <div class="detail-panel">
          <div class="detail-head">
            <div class="detail-title" id="detailTitle"></div>
            <button class="detail-close" id="detailClose" type="button">✕</button>
          </div>
          <div class="detail-sub" id="detailSub"></div>
          <div class="table-wrapper detail-table">
            <table id="detailTable">
              <thead id="detailHead"></thead>
              <tbody id="detailBody"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/main.js"></script>
  </body>
</html>
